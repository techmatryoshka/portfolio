<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#0d0d0f"/>
  
  <!-- Tiny stars -->
  <circle cx="5" cy="5" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="27" cy="7" r="0.5" fill="#c77dff" opacity="0.6"/>
  <circle cx="4" cy="26" r="0.4" fill="#f472b6" opacity="0.5"/>
  <circle cx="28" cy="25" r="0.5" fill="white" opacity="0.4"/>
  
  <!-- Just the ∞ character lol -->
  <text x="16" y="22" 
        font-family="Arial, sans-serif" 
        font-size="24" 
        font-weight="bold"
        text-anchor="middle" 
        fill="url(#textGrad)">∞</text>
  
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0aaff"/>
      <stop offset="50%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
</svg>
